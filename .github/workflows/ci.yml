name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        working-directory: api
        run: .venv/bin/python -m ruff check tests
      - name: Pytest
        working-directory: api
        run: .venv/bin/python -m pytest

  web:
    name: Web — lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm ci
      # Advisory: web/src has pre-existing ESLint debt; not a merge gate yet.
      - name: Lint
        continue-on-error: true
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
